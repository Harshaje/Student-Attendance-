<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Attendance QR</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<header><h1>Student Attendance</h1><p>QR-based attendance • Students • Reports</p></header>
<nav>
<button onclick="show('students')">Students</button>
<button onclick="show('scan')">Scan Attendance</button>
<button onclick="show('reports')">Reports</button>
</nav>
<main>
<section id="students" class="page">
<h2>Students</h2>
<div class="card">
<h3>Add Student</h3>
<div class="grid">
<input id="roll" placeholder="Roll No">
<input id="name" placeholder="Student Name">
<input id="className" placeholder="Class">
<input id="division" placeholder="Division">
<input id="email" type="email" placeholder="Student Email">
</div>
<div class="actions">
<button class="primary" onclick="addStudent()">Add Student</button>
<label class="fileBtn">Import CSV<input type="file" id="csv" accept=".csv" onchange="importCSV(event)"></label>
<button onclick="downloadCSVTemplate()">CSV Template</button>
</div>
<p id="msg"></p>
</div>
<div class="card">
<div class="toolbar"><input id="search" placeholder="Search name / roll / class" oninput="renderStudents()"><span id="count"></span></div>
<div id="studentList"></div>
</div>
</section>

<section id="scan" class="page hidden">
<h2>Scan Attendance</h2>
<div class="card">
<p>Allow camera access, then scan a student's QR.</p>
<div id="reader"></div>
<p id="scanMsg"></p>
<button onclick="startScanner()">Start Camera</button>
<button onclick="stopScanner()">Stop Camera</button>
</div>
<div class="card"><h3>Today's Attendance</h3><div id="todayList"></div></div>
</section>

<section id="reports" class="page hidden">
<h2>Reports</h2>
<div class="card">
<div class="grid"><input id="fromDate" type="date"><input id="toDate" type="date"></div>
<div class="actions">
<button onclick="exportExcel()">Export Excel</button>
<button onclick="exportPDF()">Export PDF</button>
<button onclick="downloadBackup()">Backup Database</button>
<label class="fileBtn">Restore Backup<input type="file" accept=".json" onchange="restoreBackup(event)"></label>
</div>
</div>
<div class="card"><div id="reportTable"></div></div>
</section>
</main>

<div id="qrModal" class="modal hidden"><div class="modalBox">
<button class="close" onclick="closeQR()">×</button><h2 id="qrTitle"></h2><div id="qr"></div><p id="qrText"></p>
<div class="actions"><button onclick="downloadQR()">Download QR</button><button onclick="emailQR()">Email QR</button></div>
</div></div>
<script src="app.js"></script>
</body></html>
